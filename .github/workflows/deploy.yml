name: Deploy

on:
  push:
    branches: [master]

jobs:
  # Which app actually changed on this push — the two deploy independently
  # (CLAUDE.md), so a site-only or docs-only change must not drag the tracker
  # deploy (and its red X when Fly isn't configured) along with it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      tracker: ${{ steps.filter.outputs.tracker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - '.github/workflows/deploy.yml'
            tracker:
              - 'tracker/**'

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check       # type-gate the direct-push path too (sad.md §7)
      - run: npm test            # content invariants gate the deploy, not only the PR (AC-05/AC-06)
      - run: npm run build       # dist/ incl. the committed CV PDF; postbuild asserts it exists
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  tracker:
    needs: changes
    if: needs.changes.outputs.tracker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config tracker/fly.toml --dockerfile tracker/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

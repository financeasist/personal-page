name: CI

on:
  pull_request:

jobs:
  # Which app the PR touches — the two build/test independently (CLAUDE.md).
  # tracker CI stays dormant until a PR actually changes tracker/**.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      tracker: ${{ steps.filter.outputs.tracker }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - '.github/workflows/ci.yml'
            tracker:
              - 'tracker/**'

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test          # Vitest: unit + component + build-pipeline integration (AC-05/AC-06)
      - run: npm run build      # postbuild asserts the committed CV PDF exists (ADR-0008)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e   # e2e-through-UI — gating (spec.md §Test plan "still gating"): AC-01/08/13/14, E15/E16/E17
      # Visual-regression (`npm run test:visual`) stays local-only until Linux
      # baselines are generated in a Playwright container (launch-checklist.md).

  tracker:
    needs: changes
    if: needs.changes.outputs.tracker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -f tracker/pom.xml verify

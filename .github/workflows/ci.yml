name: CI

on:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test          # Vitest: unit + component + build-pipeline integration (AC-05/AC-06)
      - run: npm run build      # postbuild asserts the committed CV PDF exists (ADR-0008)
      # e2e-through-UI + visual-regression (Playwright/Chromium) are local-only in
      # v1 — no browser is installed on the CI path (ADR-0008 §Consequences).

  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -f tracker/pom.xml verify

spring:
  application:
    name: tracker
  datasource:
    # Fly.io injects DATABASE_URL (Supabase Postgres). Local dev: override via env.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tracker}
    username: ${DATABASE_USERNAME:tracker}
    password: ${DATABASE_PASSWORD:tracker}
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# Telegram Bot API — read from Fly secrets in production.
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

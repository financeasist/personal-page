# Fly.io config for the tracker. Secrets (DATABASE_URL, DATABASE_USERNAME,
# DATABASE_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) are set with
# `flyctl secrets set ...` — never committed here.
app = "personal-landing-tracker"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
